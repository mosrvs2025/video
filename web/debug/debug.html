  for(let i=0;i<D.peaks.length;i+=10){const p=D.peaks[i]*oh*0.4; ox.fillStyle='#456'; ox.fillRect(i/D.pk/D.dur*ow,oh/2-p,2,p*2);}
  D.lines.forEach(l=>{ox.fillStyle=COL[l.conf]; ox.fillRect(l.words[0].t0/D.dur*ow,oh-14,Math.max(2,(l.words[l.words.length-1].t1-l.words[0].t0)/D.dur*ow),10);});
  ox.fillStyle='#fff'; ox.fillRect(t/D.dur*ow,0,2,oh);
  ox.fillStyle='#fff3'; ox.fillRect(t0/D.dur*ow,0,W/D.dur*ow,oh);
}
c.onclick=e=>{const r=c.getBoundingClientRect(); a.currentTime=t0+(e.clientX-r.left)/r.width*W;};
ov.onclick=e=>{const r=ov.getBoundingClientRect(); a.currentTime=(e.clientX-r.left)/r.width*D.dur;};
function loop(){draw();requestAnimationFrame(loop)} loop();
window.seek=s=>{a.currentTime=s;draw()}; window.setWin=v=>{document.getElementById('win').value=v};
</script>
